name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: go test
        run: |
          set -o pipefail
          go test -timeout 30m ./... 2>&1 | tee test-output.txt
        shell: bash
        working-directory: core
      - name: list failures
        if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:|^FAIL|timed out|cannot|error' test-output.txt | head -60 | sed 's/^/::error::/'
        shell: bash
        working-directory: core

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx vitest run
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npx vite build
        working-directory: ui

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            vscode/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: vscode
      - run: node scripts/build.mjs ui
      - run: node scripts/build.mjs core --targets host
      - run: npx vitest run
        working-directory: vscode
      - run: xvfb-run -a npm run test:smoke
        working-directory: vscode
